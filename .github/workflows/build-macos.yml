name: build-macos

# RAW 归档 macOS 原生版（SwiftUI）构建（Apple Silicon）
# · push 触发：改动 desktop/、核心脚本时自动构建，验证打包链路（产物在 Artifacts）
# · 手动触发：Run workflow 时填 release_tag（如 v1.1.0），构建成功后自动发布 Release
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-macos.yml'
      - 'fnos/rawarchiver/app/scripts/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 Release 的 tag（如 v1.1.0；留空则只上传 Artifacts）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon（M1）runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SwiftUI .app + CLI + dmg
        run: bash desktop/macos/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawArchiver-macOS
          path: desktop/macos/dist/RawArchiver-macOS-*.dmg
          if-no-files-found: error

      - name: Smoke test（.app 结构 + 内嵌 CLI 全链路）
        run: |
          set -e
          APP="desktop/macos/dist/RawArchiver.app"
          INNER="$APP/Contents/Resources/RawArchiver-cli/RawArchiver-cli"
          # 1) .app 结构
          [ -x "$APP/Contents/MacOS/RawArchiver" ] && echo "swift binary OK"
          [ -f "$APP/Contents/Info.plist" ] && echo "Info.plist OK"
          # 2) 内嵌 CLI doctor（exifread/pillow/exiftool）
          "$INNER" --doctor | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["exifread"] and d["pillow"] and d["exiftool"], d; print("cli doctor OK")'
          # 3) IPC 全链路：起 --ipc，喂 preview
          T="$(mktemp -d)"
          desktop/macos/.venv/bin/python3 -c "from PIL import Image; Image.new('RGB',(8,6)).save('$T/a.jpg', quality=85)"
          echo '{"id":1,"cmd":"preview","source":"'$T'","output":"'$T'/out","opts":{}}' | "$INNER" --ipc | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("id")==1 and d["result"]["total"]==1, d; print("ipc preview OK")'
          rm -rf "$T"

      - name: Release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          DMG="$(ls desktop/macos/dist/RawArchiver-macOS-*.dmg)"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "RAW 归档 $TAG" \
              --notes "RAW 归档 $TAG（原生 GUI 版）。macOS 安装包 .dmg：双击挂载后把 RawArchiver.app 拖进「应用程序」，首次打开右键 → 打开（未做 Apple 公证）。"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$DMG" --clobber
          echo "Release $TAG 附件已上传: $(basename "$DMG")"
