name: build-windows

# RAW 归档 Windows 原生版（WPF）构建（Win10/11 x64）
# · push 触发：改动 desktop/、核心脚本时自动构建（产物在 Artifacts）
# · 手动触发：Run workflow 时填 release_tag（如 v1.1.0），构建成功后自动发布 Release
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
      - 'fnos/rawarchiver/app/scripts/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 Release 的 tag（如 v1.1.0；留空则只上传 Artifacts）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # Win11 x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WPF exe + CLI + zip
        run: bash desktop/windows/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawArchiver-windows
          path: desktop/windows/dist/RawArchiver-windows-*.zip
          if-no-files-found: error

      - name: Smoke test（exe 结构 + 内嵌 CLI 全链路）
        run: |
          set -e
          EXE="desktop/windows/dist/publish/RawArchiver.exe"
          INNER="desktop/windows/dist/publish/RawArchiver-cli/RawArchiver-cli.exe"
          [ -f "$EXE" ] && echo "wpf exe OK"
          "$INNER" --doctor | desktop/windows/.venv/Scripts/python.exe -c 'import json,sys; d=json.load(sys.stdin); assert d["exifread"] and d["pillow"] and d["exiftool"], d; print("cli doctor OK")'
          T="$(mktemp -d)"
          desktop/windows/.venv/Scripts/python.exe -c "from PIL import Image; Image.new('RGB',(8,6)).save('$T/a.jpg', quality=85)"
          echo '{"id":1,"cmd":"preview","source":"'$T'","output":"'$T'/out","opts":{}}' | "$INNER" --ipc | desktop/windows/.venv/Scripts/python.exe -c 'import json,sys; d=json.load(sys.stdin); assert d.get("id")==1 and d["result"]["total"]==1, d; print("ipc preview OK")'
          rm -rf "$T"

      - name: Release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          ZIP="$(ls desktop/windows/dist/RawArchiver-windows-*.zip)"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "RAW 归档 $TAG" \
              --notes "RAW 归档 $TAG（原生 GUI 版）。Windows 便携包 .zip：解压后双击 RawArchiver.exe 即可（免安装，杀软若误报选「仍要运行」）。"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$ZIP" --clobber
          echo "Release $TAG 附件已上传: $(basename "$ZIP")"
