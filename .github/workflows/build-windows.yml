name: build-windows

# RAW 归档 Windows 版构建（Win10/11 x64）
# · push 触发：改动 windows/、前端或核心脚本时自动构建（产物在 Artifacts）
# · 手动触发：Run workflow 时填 release_tag（如 windows-v1.0.18），构建成功后自动发布 Release
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'fnos/rawarchiver/app/www/**'
      - 'fnos/rawarchiver/app/scripts/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 Release 的 tag（如 windows-v1.0.18；留空则只上传 Artifacts）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # Win11 x64
    defaults:
      run:
        shell: bash           # git-bash，与 build.sh 一致
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exe + zip
        run: bash windows/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawArchiver-windows
          path: windows/dist/RawArchiver-windows-*.zip
          if-no-files-found: error

      - name: Smoke test（GUI 服务 + API 全链路）
        run: windows/.venv/Scripts/python.exe windows/tests/smoke.py

      - name: Release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          ZIP="$(ls windows/dist/RawArchiver-windows-*.zip)"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "RAW 归档 Windows $TAG" \
              --notes "Windows 10/11（x64）便携版。解压 zip 后双击 RawArchiver.exe 即可使用；无需安装，杀软若误报请选「仍要运行」并加白名单。"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$ZIP" --clobber
          echo "Release $TAG 附件已上传: $(basename "$ZIP")"
          # 注意：不清理其他附件——主 Release 里三平台产物共存（.fpk=fnOS / .dmg=macOS / .zip=Windows）。
