<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="RAW 归档 —— 相机照片按拍摄日期整理归档">
<title>RAW 归档</title>
<style>
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;max-width:980px;margin:0 auto;padding:20px;color:#222}
h1 small{font-size:14px;color:#666;font-weight:400}
label{display:block;margin-top:14px;font-weight:600}
input[type=text],select{width:100%;padding:7px;margin-top:4px;box-sizing:border-box}
input[type=checkbox]{margin-right:6px}
button{margin-top:12px;padding:8px 16px;cursor:pointer;border:1px solid #bbb;background:#f5f5f5;border-radius:4px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}.row>button{flex:0 0 auto;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #ddd;padding:5px;text-align:left;word-break:break-all}
.bad{color:#c00;font-weight:600}.warn{color:#c00;margin-top:8px;line-height:1.6}
.hint{color:#080;font-size:13px;margin-left:8px}
#logBox{max-height:240px;overflow:auto;font-family:monospace;font-size:12px;background:#f7f7f7;padding:8px;margin-top:8px;white-space:pre-wrap}
#progBar{height:18px;background:#eee;border-radius:4px;overflow:hidden;margin-top:10px}
#progFill{width:0;height:100%;background:#4a9;transition:width .3s}
footer{margin-top:28px;color:#999;font-size:12px;border-top:1px solid #eee;padding-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-box{background:#fff;border-radius:6px;width:min(640px,92vw);max-height:82vh;display:flex;flex-direction:column;padding:14px;box-sizing:border-box}
.modal-head{font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal-x{cursor:pointer;border:none;background:none;font-size:22px;line-height:1;padding:0;color:#888}
.dir-toolbar{display:flex;gap:8px;margin-bottom:6px}
.dir-list{overflow:auto;flex:1;border:1px solid #ddd;border-radius:4px;min-height:180px;max-height:42vh;background:#fff}
.dir-item{padding:7px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;font-family:monospace;font-size:13px;word-break:break-all}
.dir-item:hover{background:#f2f7fb}
.dir-empty{padding:12px;color:#888;text-align:center;font-size:13px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
</style>
</head>
<body>
<h1>RAW 归档 <small>v1.0.13</small></h1>

<label>源（SD/TF/U盘或本地目录）
  <div class="row" style="margin-top:4px">
    <select id="srcSel"><option value="">— 请选择已挂载设备 —</option></select>
    <button type="button" id="refreshSrc">刷新设备</button>
  </div>
  <input type="text" id="srcPath" placeholder="或手填路径，如 /volumeUSB1/usbshare">
</label>

<label>输出目录（归档落点，不存在会自动创建）
  <div class="row" style="margin-top:4px">
    <input type="text" id="outPath" placeholder="/volume1/photos/Camera">
    <button type="button" id="browseOut">选取文件夹</button>
  </div>
  <span id="outHint" class="hint"></span>
</label>

<label>选项</label>
<div style="line-height:2">
<label style="display:inline-block;margin:0 16px 0 0;font-weight:400"><input type="checkbox" id="optBrand"> 按品牌分层</label>
<label style="display:inline-block;margin:0 16px 0 0;font-weight:400"><input type="checkbox" id="optJpg" checked> 处理 JPG</label>
<label style="display:inline-block;margin:0 16px 0 0;font-weight:400"><input type="checkbox" id="optVideo" checked> 处理视频</label>
<label style="display:inline-block;margin:0 16px 0 0;font-weight:400"><input type="checkbox" id="optStaging" checked> 内部暂存（卡源推荐）</label>
</div>

<label>模式
  <select id="optMode">
    <option value="copy">复制（保留源文件）</option>
    <option value="move">移动（归档后清空源设备，不可回滚）</option>
  </select>
</label>

<div>
  <button type="button" id="btnPreview">预览</button>
  <button type="button" id="btnStart" disabled>确认并开始</button>
  <button type="button" id="btnCancel" disabled>取消</button>
  <button type="button" id="btnCleanup">补清源</button>
  <button type="button" id="btnRollback">回滚</button>
</div>

<div id="previewBox" style="display:none;margin-top:16px">
  <div id="prevSummary"></div>
  <div id="prevWarn" class="warn"></div>
  <details id="prevDetails">
    <summary id="prevToggle" style="cursor:pointer;font-weight:600;margin-top:8px">文件清单</summary>
    <div style="overflow:auto">
      <table><thead><tr><th>源文件</th><th>拍摄日期</th><th>日期来源</th><th>目标路径</th></tr></thead>
      <tbody id="prevBody"></tbody></table>
    </div>
  </details>
</div>

<div id="statusBox" style="margin-top:16px;display:none">
  <div id="progBar"><div id="progFill"></div></div>
  <div id="progText"></div>
  <div id="logBox"></div>
</div>

<div id="dirModal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">选取输出文件夹
      <button type="button" id="dirClose" class="modal-x" title="关闭">×</button>
    </div>
    <div class="row" style="margin-bottom:6px">
      <input type="text" id="dirPath" placeholder="/vol1/photos">
      <button type="button" id="dirGo">跳转</button>
    </div>
    <div class="dir-toolbar">
      <button type="button" id="dirUp" title="上级目录">⬆ 上级目录</button>
      <button type="button" id="dirRoot" title="回到根目录">根目录</button>
    </div>
    <div id="dirList" class="dir-list"></div>
    <div id="dirMsg" class="hint" style="margin-top:6px"></div>
    <div class="modal-foot">
      <button type="button" id="dirCancel">取消</button>
      <button type="button" id="dirOk">选择此文件夹</button>
    </div>
  </div>
</div>

<footer>RAW 归档 · 源设备只读优先，移动模式仅在归档全部成功后清源 · 任务态写在 &lt;输出目录&gt;/.rawarchiver/</footer>

<script type="module">
// 飞牛统一网关微应用：静态 / API 都走 /app/rawarchiver 前缀。
// 目录选择优先用飞牛 JS SDK（TrimApp）系统内部弹窗，桥不可用时回落 window.open / 内置目录浏览器。
import { s as TrimApp } from './assets/fnnas.js';

const GATEWAY_PREFIX = '/app/rawarchiver';
const API = GATEWAY_PREFIX + '/api';
const LS = 'rawarchiver.state';
const $ = id => document.getElementById(id);
const api = (act, body={}) => fetch(API + '?action=' + act, {
  method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify(Object.assign({action:act}, body))
}).then(r => r.json()).catch(e => ({ok:false, error:'请求失败: ' + e}));

// ---- 飞牛目录选择框：优先走 JS SDK 系统内部弹窗（微应用环境），回落 window.open 重定向流 ----
const APP_BASE = GATEWAY_PREFIX;
const AUTH_CALLBACK = APP_BASE + '/auth-callback.html';
const AUTH_STATE_KEY = 'rawarchiver:fnnas-app-auth-request';
const AUTH_MSG = 'rawarchiver:fnnas-app-auth';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : Date.now() + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2));

// 返回所选文件夹路径数组；失败 / 取消 / 弹窗被拦则返回 null（由调用方回落内置目录浏览器）
const withTimeout = (p, ms) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
]);

// 页面加载即初始化 SDK（单例 + 硬超时），把 penpal 握手提前到页面加载（对齐 file.dedupe）
let _sdk = null, _sdkInit = null;
function getSdk() {
  if (!_sdkInit) {
    _sdkInit = (async () => {
      try {
        const s = new TrimApp();
        await withTimeout(s.ready(), 5000);
        _sdk = s;
      } catch (e) {
        _sdk = null;
        console.warn('[rawarchiver] SDK 初始化失败/超时:', e && e.message);
      }
      return _sdk;
    })();
  }
  return _sdkInit;
}
getSdk();

async function pickFolderNative() {
  // 1) 优先：飞牛 JS SDK 系统内部弹窗（微应用环境，非独立浏览器）
  const sdk = await getSdk();
  if (sdk && !sdk.isStandaloneWeb) {
    try {
      const r = await withTimeout(sdk.pickSharedFile({
        title: '选择输出目录',
        okText: '选择',
        sidebarGroup: ['myFiles', 'otherShare', 'external', 'remote', 'favorites', 'team'],
        creatable: false
      }), 20000);
      if (r && r.code === 0) return Array.isArray(r.data) ? r.data : [];
      // code != 0（如非管理员）→ 回落
      if (r && r.msg) console.warn('[rawarchiver] pickSharedFile 返回:', r.code, r.msg);
      return null;
    } catch (e) {
      console.warn('[rawarchiver] pickSharedFile 失败/超时:', e && e.message);
      return null;
    }
  }
  // 2) 回落：独立浏览器或桥不可用 → window.open + auth-callback
  return pickFolderViaWindow();
}

function pickFolderViaWindow() {
  return new Promise((resolve) => {
    const state = uuid();
    sessionStorage.setItem(AUTH_STATE_KEY, JSON.stringify({ state, method: 'pickSharedFile' }));
    const cb = location.origin + AUTH_CALLBACK;
    const url = location.origin + '/app-auth/pick-shared-file'
      + '?appName=rawarchiver'
      + '&sidebarGroup=' + encodeURIComponent('myFiles,otherShare,external,remote,favorites,team')
      + '&redirectUri=' + encodeURIComponent(cb)
      + '&state=' + encodeURIComponent(state);
    const feats = 'width=750,height=630';
    let win = null;
    try { win = window.open(url, '_blank', feats); } catch (e) { win = null; }
    if (!win) { sessionStorage.removeItem(AUTH_STATE_KEY); resolve(null); return; }
    let done = false;
    const finish = (paths) => {
      if (done) return; done = true;
      clearTimeout(timer); window.removeEventListener('message', onMsg);
      sessionStorage.removeItem(AUTH_STATE_KEY); resolve(paths);
    };
    const timer = setTimeout(() => finish(null), 120000);
    const onMsg = (ev) => {
      if (ev.origin !== location.origin || !ev.data || ev.data.type !== AUTH_MSG) return;
      const r = ev.data.result;
      if (!r || r.state !== state || r.method !== 'pickSharedFile') return;
      if (ev.data.stateValid === false || ev.data.methodValid === false) { finish(null); return; }
      finish(Array.isArray(r.path) && r.path.length ? r.path : null);
    };
    window.addEventListener('message', onMsg);
  });
}

let tid = null, timer = null;
const save = () => localStorage.setItem(LS, JSON.stringify({src:$('srcPath').value, out:$('outPath').value, mode:$('optMode').value}));
const load = () => { try { const o = JSON.parse(localStorage.getItem(LS)||'{}');
  $('srcPath').value = o.src||''; $('outPath').value = o.out||''; if (o.mode) $('optMode').value = o.mode; } catch(e){} };
load();

const isRemovable = () => /^\/(volumeUSB|mnt\/usb|media|run\/media|Volumes)/.test($('srcPath').value.trim());
const check = () => { const ok = $('srcPath').value.trim() && $('outPath').value.trim() && $('previewBox').dataset.ready === '1';
  $('btnStart').disabled = !ok; };
$('srcPath').oninput = $('outPath').oninput = () => { save(); check(); $('outHint').textContent=''; };
$('optMode').onchange = save;

$('refreshSrc').onclick = async () => {
  const r = await api('devices');
  const sel = $('srcSel');
  sel.innerHTML = '<option value="">— 请选择已挂载设备 —</option>';
  (r.list||[]).forEach(d => { const o = document.createElement('option');
    o.value = d.path; o.textContent = (d.label||'未命名卷') + ' (' + d.path + ') ' + d.files + ' 个可归档文件';
    sel.appendChild(o); });
  if (!(r.list||[]).length) sel.innerHTML = '<option value="">未发现 /volumeUSB* 设备，可手填路径</option>';
  sel.onchange = () => { $('srcPath').value = sel.value; save(); check(); };
};
$('refreshSrc').click();

// ---- 输出目录：选取文件夹（服务端目录浏览器）----
let dirCurrent = '/', dirParent = null;
async function loadDir(path){
  $('dirMsg').textContent = '';
  const r = await api('browse', {path: path});
  if (!r.ok) {
    $('dirList').replaceChildren();
    $('dirMsg').style.color = '#c00';
    $('dirMsg').textContent = r.error || '读取失败';
    return false;
  }
  dirCurrent = r.path; dirParent = r.parent;
  $('dirPath').value = r.path;
  $('dirUp').disabled = !r.parent;
  $('dirMsg').style.color = '#080';
  $('dirMsg').textContent = (r.dirs.length ? r.dirs.length + ' 个子目录' : '该目录下无子目录')
    + (r.writable ? '' : ' · 当前目录不可写');
  const box = $('dirList'); box.replaceChildren();
  if (!r.dirs.length) {
    const e = document.createElement('div');
    e.className = 'dir-empty';
    e.textContent = '（没有可进入的子目录）';
    box.appendChild(e);
  } else {
    r.dirs.forEach(d => {
      const el = document.createElement('div');
      el.className = 'dir-item';
      el.textContent = '📁 ' + d.name;
      el.onclick = () => loadDir(d.path);
      box.appendChild(el);
    });
  }
  return true;
}
async function openDirPicker(){
  $('dirModal').style.display = 'flex';
  $('outHint').textContent = '';
  const start = $('outPath').value.trim();
  if (!(await loadDir(start || '/'))) await loadDir('/');
}
$('browseOut').onclick = async () => {
  const paths = await pickFolderNative();
  if (paths !== null) {                       // 用了飞牛自带选择框
    if (paths.length) {
      $('outPath').value = paths[0];
      $('outHint').textContent = '已选择：' + paths[0];
      $('outHint').style.color = '#080';
      save(); check();
    }
    return;                                   // 空数组 = 用户取消，不再弹自带框
  }
  openDirPicker();                            // 原生框没选到/被拦 -> 内置目录浏览器兜底
};
$('dirClose').onclick = $('dirCancel').onclick = () => { $('dirModal').style.display = 'none'; };
$('dirUp').onclick = () => { if (dirParent) loadDir(dirParent); };
$('dirRoot').onclick = () => loadDir('/');
$('dirGo').onclick = () => loadDir($('dirPath').value.trim() || '/');
$('dirPath').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadDir($('dirPath').value.trim() || '/'); } });
$('dirModal').onclick = e => { if (e.target === $('dirModal')) $('dirModal').style.display = 'none'; };
$('dirOk').onclick = () => {
  $('outPath').value = dirCurrent;
  $('outHint').textContent = '已选择：' + dirCurrent;
  $('outHint').style.color = '#080';
  $('dirModal').style.display = 'none';
  save(); check();
};

$('btnPreview').onclick = async () => {
  const body = {source: $('srcPath').value.trim(), output: $('outPath').value.trim(),
    brandFolder: $('optBrand').checked, handleJpg: $('optJpg').checked,
    handleVideo: $('optVideo').checked, staging: $('optStaging').checked};
  if (!body.source || !body.output) { alert('请先填写源与输出目录'); return; }
  $('prevSummary').textContent = '正在扫描源（读卡较慢，请稍候）...';
  $('previewBox').style.display = 'block'; $('previewBox').dataset.ready = '';
  const r = await api('preview', body);
  if (!r.ok) { $('prevSummary').textContent=''; $('prevWarn').textContent = r.error; return; }
  const d = r.result;
  $('prevSummary').innerHTML = '<b>' + d.total + '</b> 个文件 / ' + (d.size/1073741824).toFixed(2)
    + ' GB ｜ 日期 ' + (d.date_range[0]||'?') + ' ~ ' + (d.date_range[1]||'?')
    + ' ｜ ExifTool: ' + (d.exiftool ? '可用' : '未找到（视频日期会退化）');
  let w = '';
  if (d.bad_count) w += '注意：' + d.bad_count + ' 个文件只能靠文件修改时间推断日期，请核对后再执行。<br>';
  if (d.raw_skip_hint) w += '提示：' + d.raw_skip_hint + ' 个照片读不到拍摄日期，执行时将被跳过（不拷贝）。<br>';
  if (d.conflicts) w += '提示：' + d.conflicts + ' 个目标已存在同名文件，将自动追加 _1/_2。<br>';
  if (d.removable && $('optMode').value === 'move')
    w += '<b>源为可移动设备，移动模式下归档完成后将清空卡上约 ' + (d.size/1073741824).toFixed(2)
       + ' GB 文件，此操作不可回滚。</b>';
  $('prevWarn').innerHTML = w;
  $('prevBody').innerHTML = (d.sample||[]).map(s => '<tr><td>' + s.src + '</td><td>' + (s.date||'—')
    + '</td><td class="' + (s.bad?'bad':'') + '">' + s.date_from + '</td><td>' + (s.dst_rel||'') + '</td></tr>').join('');
  $('prevToggle').textContent = '文件清单（' + d.total + ' 个文件，点击展开/折叠）';
  $('previewBox').dataset.ready = '1'; check();
};

$('btnStart').onclick = async () => {
  if ($('optMode').value === 'move' && isRemovable() &&
      !confirm('确认归档后清空源设备上的文件？此操作不可回滚。')) return;
  const r = await api('start', {source: $('srcPath').value.trim(), output: $('outPath').value.trim(),
    mode: $('optMode').value, brandFolder: $('optBrand').checked, handleJpg: $('optJpg').checked,
    handleVideo: $('optVideo').checked, staging: $('optStaging').checked});
  if (!r.ok) { alert(r.error); return; }
  tid = r.taskId; $('btnStart').disabled = true; $('btnCancel').disabled = false;
  $('statusBox').style.display = 'block'; $('logBox').textContent = '';
  timer = setInterval(poll, 1500); poll();
};

async function poll(){
  const r = await api('status', {id: tid, output: $('outPath').value.trim()});
  if (!r.ok) return;
  const s = r.state;
  const pct = s.total ? Math.round(s.current/s.total*100) : 0;
  $('progFill').style.width = pct + '%';
  $('progText').textContent = s.status + '  ' + s.current + '/' + s.total
    + ' ｜ 成功 ' + s.success + ' 失败 ' + s.failed + ' 跳过 ' + s.skipped;
  $('logBox').textContent = (s.logs||[]).slice(-80).map(l => '[' + l.t + '] ' + (l.msg || l.dst || l.src)).join('\n');
  $('logBox').scrollTop = $('logBox').scrollHeight;
  if (['done','error','cancelled','rolled_back'].indexOf(s.status) >= 0) {
    clearInterval(timer); $('btnCancel').disabled = true; $('btnStart').disabled = false;
    if (s.status === 'done') alert('RAW 归档完成：成功 ' + s.success + ' 个');
  }
}

$('btnCancel').onclick = async () => { const r = await api('cancel', {taskId: tid, output: $('outPath').value.trim()});
  if (!r.ok) alert(r.error); };
$('btnCleanup').onclick = async () => {
  if (!tid) tid = prompt('输入任务ID（输出目录 .rawarchiver/tasks/ 下的目录名）');
  if (!tid) return;
  const r = await api('cleanup', {taskId: tid, output: $('outPath').value.trim()});
  alert(r.ok ? ('已删除 ' + r.deleted + ' 个' + (r.kept && r.kept.length ? ('，保留 ' + r.kept.length + ' 个（大小校验未过）') : '')) : r.error);
};
$('btnRollback').onclick = async () => {
  if ($('optMode').value === 'move') { alert('移动模式下源文件已清除，无法回滚，请依靠 _report_*.json 清单处理。'); return; }
  if (!tid) { alert('请先执行或输入任务ID'); return; }
  if (!confirm('确认把本任务已归档的文件移回输出目录下的 _restored/ ？')) return;
  const r = await api('rollback', {taskId: tid, output: $('outPath').value.trim()});
  alert(r.ok ? ('已还原 ' + r.restored + ' 个到 ' + r.to) : r.error);
};
</script>
</body>
</html>
